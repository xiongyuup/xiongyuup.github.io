name: Back Up Visitor Database

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: visitor-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.VISITOR_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Export, encrypt and verify database
        run: node counter/scripts/backup.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
          VISITOR_BACKUP_KEY: ${{ secrets.VISITOR_BACKUP_KEY }}
          VISITOR_COUNTER_URL: ${{ vars.VISITOR_COUNTER_URL }}
      - name: Keep encrypted backups in Git history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add counter-backups/*.sql.enc counter-backups/*.json
          if [ -f visitor-totals.json ]; then git add visitor-totals.json; fi
          git commit -m 'Back up visitor database [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish updated backup totals to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pages/builds`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
            },
            signal: AbortSignal.timeout(30000)
          });
          if (!response.ok) throw new Error(`Could not request snapshot publication (${response.status})`);
          console.log('Requested GitHub Pages publication of the verified aggregate snapshot.');
          NODE
