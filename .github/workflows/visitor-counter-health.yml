name: Check Visitor Counter

on:
  workflow_dispatch:
  schedule:
    - cron: '15 19 * * *'

permissions:
  contents: read

jobs:
  health:
    if: vars.VISITOR_COUNTER_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check read-only counter endpoint
        env:
          COUNTER_URL: ${{ vars.VISITOR_COUNTER_URL }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url = new URL('/stats', process.env.COUNTER_URL);
          assert.equal(url.protocol, 'https:');
          const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
          assert.equal(response.status, 200, 'Counter must return HTTP 200');
          const data = await response.json();
          assert.equal(data.includesHistory, true);
          assert.ok(Number.isSafeInteger(data.uv) && data.uv >= 19);
          assert.ok(Number.isSafeInteger(data.pv) && data.pv >= 45 && data.pv >= data.uv);
          console.log(`Counter healthy: visitors=${data.uv}, views=${data.pv}`);
          const locked = await fetch(new URL('/admin/api', url), { signal: AbortSignal.timeout(30000) });
          assert.equal(locked.status, 401, 'Admin data must require authentication');
          assert.equal(locked.headers.get('Access-Control-Allow-Origin'), null);
          const admin = await fetch(new URL('/admin', url), { signal: AbortSignal.timeout(30000) });
          assert.equal(admin.status, 200);
          assert.ok(admin.headers.get('Content-Security-Policy')?.includes("frame-ancestors 'none'"));
          console.log('Admin page available; anonymous data access denied.');
          NODE
